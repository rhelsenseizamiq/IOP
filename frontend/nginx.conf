server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # IT Tools SPA — served from /usr/share/nginx/html/it-tools/
    location /it-tools/ {
        alias /usr/share/nginx/html/it-tools/;
        try_files $uri $uri/ /it-tools/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /it-tools/assets/ {
        alias /usr/share/nginx/html/it-tools/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for 1 year (content-hashed filenames)
    location ~* \.(js|css|png|jpg|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html so users always get latest app shell
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

}
