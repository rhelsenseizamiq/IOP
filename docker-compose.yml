services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: iop-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ipam
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    networks:
      - iop-internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iop-api
    restart: unless-stopped
    env_file: .env.api
    cap_add:
      - NET_RAW
    volumes:
      # AI assistant's Docker status capability reads this — written by
      # scripts/docker_status_snapshot.sh on the HOST via cron, never by
      # this container. Deliberately read-only and a plain file, not
      # docker.sock: see docker_status_snapshot.sh's own header comment
      # for why the socket itself is never mounted here.
      - ./docker_status.json:/app/docker_status.json:ro
      # File-sharing feature's encrypted blob storage — NOT ./ (that's the
      # /opt/IOP app-root volume, too small for this); must persist across
      # container recreates, hence the real host path, not an anonymous
      # volume. matches FILE_STORAGE_ROOT in app/config.py.
      - /data/iop-file-storage:/app/file_storage
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - iop-internal
      - iop-external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── React Frontend (multi-stage: build + nginx:alpine) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iop-frontend
    restart: unless-stopped
    networks:
      - iop-internal

  # ── Nginx Reverse Proxy (TLS termination) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: iop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/ipam.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./nginx/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - iop-internal
      - iop-external

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  iop-internal:
    internal: true
    driver: bridge
  iop-external:
    driver: bridge
