# Internal network allowlist — only RFC-1918 ranges are permitted
geo $allowed_internal {
    default          0;
    10.0.0.0/8       1;
    172.16.0.0/12    1;
    192.168.0.0/16   1;
    127.0.0.1/32     1;  # loopback for health-check probes
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login_zone:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:20m    rate=200r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ipam.abb-bank.az;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ipam.abb-bank.az;

    # ── IP Allowlist ────────────────────────────────────────────────────────────
    if ($allowed_internal = 0) {
        return 403;
    }

    # ── TLS ────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # ── Proxy Buffering Tuning (prevents disk buffering of large static assets) ──
    proxy_buffers 128 8k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 64k;

    # ── Security Headers ────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Login endpoint (strict rate limit) ─────────────────────────────────────
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── AI Assistant endpoints — offline LLM inference on old CPU hardware
    # (no AVX2; ~1.1 tok/s prompt eval, ~0.18 tok/s generation measured) is
    # genuinely slow — a real RAG chat call pays BOTH costs. Give it real
    # headroom instead of nginx cutting the request early at the general
    # 60s API timeout below; the backend itself caps generation length
    # (num_predict) so this is a ceiling, not the expected typical time.
    # Must match ai_service.py's _CHAT_READ_TIMEOUT — kept in sync
    # manually, there's no shared config between nginx and the app. ──
    location /api/v1/assistant/ {
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 10s;
    }

    # ── File-sharing endpoints (larger body, slower transfer than typical
    # JSON calls) — own location so the general /api/ block below doesn't
    # need its small timeout/body-size raised for every other endpoint.
    # Internal-only for now (still behind the $allowed_internal gate above,
    # same as everything else) — the external-access carve-out for file
    # share links is a separate, deliberate later step, not done here. ──
    location /api/v1/files {
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;

        client_max_body_size 250m;
        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── All other API endpoints ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Health check (no rate limit, no auth) ───────────────────────────────────
    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    # ── IT Tools SPA — relaxed CSP needed for Vue runtime + PWA service worker ──
    location /it-tools/ {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_pragma;

        # Override CSP for IT Tools (Vue SPA needs unsafe-eval; PWA needs worker-src)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # ── React SPA (served by frontend container) ────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SPA cache: cache assets, never cache index.html
        proxy_cache_bypass $http_pragma;
    }
}
